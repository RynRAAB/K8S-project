apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contacts-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: contacts.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: repertoire-contacts-service  
            port:
              number: 80
