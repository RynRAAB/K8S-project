<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifier Contact</title>
    <meta charset="UTF-8">
    <style>
        form { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
    <h1>✏️ Modifier Contact</h1>
    
    <div th:if="${error}" class="error" th:text="${error}"></div>
    
    <form th:action="@{/update/{id}(id=${contact.id})}" th:object="${contact}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <label>Nom:</label>
        <input type="text" th:field="*{nom}" required><br>
        
        <label>Prénom:</label>
        <input type="text" th:field="*{prenom}" required><br>
        
        <label>Téléphone:</label>
        <input type="text" th:field="*{telephone}" required><br>
        
        <label>Email:</label>
        <input type="email" th:field="*{email}" required><br>
        
        <button type="submit">💾 Enregistrer Modifications</button>
        <a th:href="@{/}" style="margin-top:10px; display:inline-block;">
            ← Retour à la liste
        </a>
    </form>
</body>
</html>
